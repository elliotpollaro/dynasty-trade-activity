# A GitHub release on the 1st of each month, when a newer data week has landed since the last
# release (README or other edits alone don't make a new version).
# Zenodo archives every release and gives it a DOI (the concept DOI always points at the newest).
# The weekly data commits come from Dynasty Dealer's own job; this only snapshots them.
name: Monthly release (Zenodo snapshot)

on:
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release if there are new weeks since the last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(tail -n 1 data/market_weekly.csv | cut -d, -f1)
          last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$last" ]; then
            released=$(git show "$last:data/market_weekly.csv" | tail -n 1 | cut -d, -f1)
            if [ "$newest" = "$released" ]; then
              echo "No new weeks since $last (newest is still $newest)"
              exit 0
            fi
          fi
          tag="v$(date -u +%Y.%m.%d)"
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "Weekly trade activity through the week of $newest" \
            --notes "Snapshot of the weekly files, March 2, 2026 through the week starting $newest. Archived on Zenodo."
